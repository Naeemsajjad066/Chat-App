name: Deploy

# Only runs on push to main.
# Deploys client and server to Vercel in parallel.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Guard — fail fast if required secrets are missing ────────────────────────
  check-secrets:
    name: Check required secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify VERCEL_TOKEN is set
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set."
            echo "::error::Go to: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "VERCEL_TOKEN is present."

      - name: Verify VITE_BACKEND_URL is set
        run: |
          if [ -z "${{ secrets.VITE_BACKEND_URL }}" ]; then
            echo "::error::VITE_BACKEND_URL secret is not set."
            exit 1
          fi
          echo "VITE_BACKEND_URL is present."

  # ── DEPLOY CLIENT ────────────────────────────────────────────────────────────
  deploy-client:
    name: Deploy client → Vercel
    runs-on: ubuntu-latest
    needs: check-secrets
    environment:
      name: production-client
      url: ${{ steps.deploy.outputs.url }}

    # Pass token via env var — Vercel CLI reads VERCEL_TOKEN automatically.
    # Never use --token= flag; an empty value causes "missing token" errors.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production
        working-directory: client

      - name: Build for Vercel
        run: vercel build --prod
        working-directory: client
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod)
          echo "url=$url" >> $GITHUB_OUTPUT
        working-directory: client

  # ── DEPLOY SERVER ────────────────────────────────────────────────────────────
  deploy-server:
    name: Deploy server → Vercel
    runs-on: ubuntu-latest
    needs: check-secrets
    environment:
      name: production-server
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production
        working-directory: server

      - name: Build for Vercel
        run: vercel build --prod
        working-directory: server

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod)
          echo "url=$url" >> $GITHUB_OUTPUT
        working-directory: server
