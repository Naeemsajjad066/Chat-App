name: CI

# Runs on every push and pull request to any branch.
# Lints + builds both apps so broken code never merges to main.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── CLIENT ──────────────────────────────────────────────────────────────────
  client:
    name: Client — lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vite needs the env var at build time — use a dummy value in CI
      - name: Build
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://placeholder.example.com' }}

      - name: Lint
        run: npm run lint

  # ── SERVER ──────────────────────────────────────────────────────────────────
  server:
    name: Server — lint & syntax check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Node can type-check ES modules with --input-type=module
      # This catches import errors, missing files, syntax issues
      - name: Syntax check entry point
        run: node --check server.js
